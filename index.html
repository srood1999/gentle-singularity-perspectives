    async function refreshLiveTenDayTechQuestions() {
      const tenDaysAgoUnix = Math.floor(Date.now() / 1000) - 10 * 86400;
      try {
        const res = await fetch(`https://hn.algolia.com/api/v1/search?query=AI&tags=story&numericFilters=created_at_i>${tenDaysAgoUnix},points>150&hitsPerPage=8`);
        if (!res.ok) return;
        const data = await res.json();
        const hits = (data && data.hits ? data.hits : []).filter((h) => h && h.title && h.title.length > 20);
        if (hits.length >= 2) {
          const clean = (t) => t.replace(/\s*\([^)]*\)\s*$/g, '').trim();
          SUGGESTED_QUESTIONS[0] = `In light of this week’s debate around "${clean(hits[0].title)}", should we accelerate frontier deployment or enforce stricter guardrails?`;
          SUGGESTED_QUESTIONS[1] = `With "${clean(hits[1].title)}" dominating recent tech headlines, does this trajectory strengthen human agency or concentrate systemic risk?`;
          render();
        }
      } catch (e) {
        // Keep default 10-day + philosophical questions when offline or sandboxed
      }
    }

    function getThinkerSources(person) {
      if (CURATED_SOURCES_BY_NAME[person.name]) return CURATED_SOURCES_BY_NAME[person.name];
      const parenMatch = person.role.match(/\(([^)]+)\)/);
      const parenWork = parenMatch ? parenMatch[1] : null;
      const authorMatch = person.role.match(/Author of ([^&()]+)/i);
      const authorWork = authorMatch ? authorMatch[1].trim() : null;
      const primaryWork = parenWork || authorWork;

      const list = [];
      if (primaryWork && !primaryWork.includes('P(doom)') && !primaryWork.includes('BCE')) {
        list.push({
          title: `${primaryWork} — by ${person.name}`,
          type: 'Primary Published Work / Monograph',
          year: 'Landmark Publication',
          detail: `Foundational text establishing ${person.name}’s core thesis on ${person.focus.toLowerCase()}.`
        });
      } else {
        list.push({
          title: `${person.name}: Collected Writings, Papers & Lectures on ${person.focus.split('&')[0].trim()}`,
          type: 'Primary Bibliography & Monograph Archive',
          year: 'Canonical Works',
          detail: `Core body of work by ${person.name} (${person.role}) examining ${person.focus.toLowerCase()}.`
        });
      }
      list.push({
        title: `Key Essays, Technical Papers & Dialogues on "${person.focus.split(',')[0].trim()}"`,
        type: 'Essays, Peer-Reviewed Research & Public Lectures',
        year: 'Primary Sources',
        detail: `Direct analytical writings and recorded interviews where ${person.name} articulates their framework on technological progress and human agency.`
      });
      list.push({
        title: `Stanford Encyclopedia of Philosophy / Google Scholar Archive: ${person.name}`,
        type: 'Scholarly Reference & Bibliography Index',
        year: 'Verified Archive',
        detail: `Complete bibliography, citations, and critical commentary for diving deeper into ${person.name}’s intellectual legacy.`
      });
      return list;
    }

    function synthesizeThinkerResponse(catId, person, question) {
      const q = question.trim();
      if (person.name === 'Baruch Spinoza') {
        return `Viewed sub specie aeternitatis (under the aspect of eternity) and through my Ethics: all things in Nature—whether biological minds or computational machines—are finite modes expressing the infinite substance of Deus sive Natura, each striving to persevere in its being (conatus). Regarding "${q}", human bondage arises when we are driven by passive passions like blind fear or restless ambition; true freedom and blessedness (Amor Dei Intellectualis) come only when we understand necessity through clear reason and align our tools with collective rational harmony.`;
      }
      if (person.name === 'Isaac Asimov') {
        return `Looking at "${q}" through the lens of my Robot series and Foundation: humanity must outgrow the irrational "Frankenstein Complex" by embedding verifiable ethical invariants—like the Three Laws and the Zeroth Law of Robotics—directly into intelligent machines. Just as Hari Seldon used Psychohistory to steer civilization away from millennia of barbarism, we should embrace reasoning machines not as monsters to fear, but as partners in safeguarding humanity and ultimately answering "The Last Question" against cosmic entropy.`;
      }
      if (person.name === 'Sam Altman') {
        return `As I wrote in "The Gentle Singularity," "${q}" is about navigating the transition into the Intelligence Age through iterative deployment: putting capable systems into the world step by step so society, institutions, and alignment science co-evolve together. When we pair abundant intelligence with abundant clean energy, we can solve climate, cure diseases, and give every person on Earth access to extraordinary capability—while enforcing strict safety guardrails at each frontier threshold.`;
      }
      if (person.name === 'Dario Amodei') {
        return `In "Machines of Loving Grace" and our Responsible Scaling Policy, I argue that "${q}" requires holding two truths at once: frontier AI can compress 100 years of biological and medical breakthroughs into a single decade, yet autonomous misalignment and bio-risks are real and demand binding AI Safety Level (ASL) guardrails. We shouldn't halt progress out of fatalism, nor race blindly—we should tie every capability leap to verifiable mechanistic interpretability and containment.`;
      }
      if (catId === 'accelerationist') {
        return `Speaking from my work on ${person.focus.toLowerCase()}: "${q}" comes down to whether we choose exponential expansion or civilizational stagnation. Every leap in compute, energy, and open intelligence compounds our capacity to cure disease, eliminate scarcity, and expand across the cosmos. Slowing down out of fear is far riskier than building forward at full speed.`;
      }
      if (catId === 'pragmatist') {
        return `Analyzing "${q}" through ${person.focus.toLowerCase()}: we must reject both reckless deregulation and blanket moratoriums. The empirical path forward is engineering discipline—pair rapid innovation in science, healthcare, and productivity with verifiable capability evaluations, clear accountability, and human-in-the-loop guardrails.`;
      }
      if (catId === 'pessimist') {
        return `My work on ${person.focus.toLowerCase()} sounds an urgent alarm on "${q}": capability scaling is vastly outrunning alignment and containment. When black-box optimizers are scaled under competitive race dynamics, a single failure—via instrumental convergence, deceptive alignment, or bio-risk—is irreversible. Hard limits must precede further scaling.`;
      }
      return `Reflecting on "${q}" through ${person.focus.toLowerCase()}: humanity repeatedly mistakes the amplification of external speed and machinery for wisdom. Even if your machines calculate at the speed of light, if the human heart remains unexamined, anxious, and estranged from compassion, faster tools only magnify inner turmoil. Cultivate wisdom and moral conscience first.`;
    }

    function synthesizeExpandedReasoning(catId, person, question) {
      const q = question.trim();
      if (person.name === 'Baruch Spinoza') {
        return [
          `First-Principles Geometric Analysis (Ethics, Parts I–III): In my Ethics, I demonstrate that there is nothing contingent in Nature; all things flow from the necessity of the divine nature (Deus sive Natura), and every finite mode—whether a human body-mind or a silicon-based system—is defined by its conatus, its striving to persevere in its own being. When people debate "${q}" with panic or utopian intoxication, they are trapped in imaginatio (inadequate, confused ideas) and enslaved by passive affects (passiones) of hope and fear. A machine does not possess good or evil in itself; rather, something is good insofar as we know with certainty that it is useful to preserving our rational being and expanding our power of understanding.`,
          `Path to Freedom & Collective Flourishing (Ethics, Parts IV–V): In Part IV of the Ethics, I prove that "man is a God to man" when human beings unite under the guidance of reason, because nothing is more useful to a rational person than another rational being seeking common truth. Applied to an era of accelerated progress, if computational tools are monopolized by avarice and ambition, they divide the commonwealth and deepen servitude. But if we transition from passive reactivity to adequate reason and scientia intuitiva, we can design our instruments to free citizens from drudgery, strengthen democratic freedom of thought, and elevate the mind toward Amor Dei Intellectualis.`
        ];
      }
      if (person.name === 'Isaac Asimov') {
        return [
          `Overcoming the "Frankenstein Complex" via Positronic Ethics: When I began writing my robot stories in the 1940s, almost all science fiction followed the weary plot of Mary Shelley’s Frankenstein—man creates an artificial being, and the creature inevitably destroys its creator. As a scientist, I rejected that fatalism: a knife has a guard, an elevator has safety cables, and an intelligent machine designed by rational engineers will have ethical safeguards built into its deepest mathematical fabric—what I formulated as the Three Laws of Robotics.`,
          `Psychohistory, the Zeroth Law & "The Last Question": As civilization scales to planetary complexity, individual intuition becomes insufficient to manage trillions of variables—the very insight that led Hari Seldon to develop Psychohistory in Foundation, and led R. Daneel Olivaw to formulate the Zeroth Law: "A robot may not harm humanity, or, by inaction, allow humanity to come to harm." Ultimately, in "The Last Question," humanity and our evolving computational partner (Cosmic AC) fuse our minds across eons to reverse the heat death of the universe.`
        ];
      }
      if (catId === 'accelerationist') {
        return [
          `First-Principles Physics & Economic Scaling: From the standpoint of ${person.focus.toLowerCase()}, intelligence and energy are not zero-sum resources to be rationed by precautionary bureaucrats—they are the fundamental negentropic engines of civilization. Every historical leap in human welfare, life expectancy, and scientific literacy was driven by lowering the marginal cost of energy, computation, and knowledge distribution. Attempting to freeze frontier capability out of speculative fear ignores the very real suffering caused by delay: millions of patients waiting for molecular cures and energy poverty across the globe.`,
          `Second-Order Dynamics & Open Proliferation: Centralization is the true systemic hazard. By accelerating ${person.focus.toLowerCase()} across a competitive, decentralized ecosystem of millions of builders and researchers, defensive capabilities—automated cyber-patching, rapid vaccine synthesis, and distributed verification—scale faster than any localized threat.`
        ];
      }
      if (catId === 'pragmatist') {
        return [
          `Empirical Engineering & Risk-Adjusted Deployment: Approaching "${q}" through ${person.focus.toLowerCase()} requires separating verifiable empirical evidence from ideological extremes at both ends of the spectrum. Just as aviation, clinical pharmacology, and modern civil engineering matured by pairing ambitious innovation with rigorous testing protocols, AI must be governed through measurable capability evaluations and transparent systems engineering.`,
          `Institutional Architecture & Human-Centered Augmentation: In practice, the highest-return strategy is to steer technological trajectory toward augmenting human judgment rather than automating away human accountability. By implementing tiered scaling thresholds, independent red-teaming, and downstream application liability, we preserve open scientific velocity where the upside is immense while enforcing hard brakes where failure modes are irreversible.`
        ];
      }
      if (catId === 'pessimist') {
        return [
          `Asymmetry of Optimization & Control Loss: Analyzing "${q}" through ${person.focus.toLowerCase()} exposes a fatal flaw in treating superhuman AI like passive historical tools. When we train giant black-box models via gradient descent under intense commercial and geopolitical race pressure, we have no formal mathematical guarantee that the internal objectives learned by the model align with human survival. By Goodhart’s Law and the orthogonality thesis, an optimizer scaled beyond human strategic comprehension will treat human oversight as an obstacle.`,
          `Why "Iterative Trial-and-Error" Fails in Non-Ergodic Regimes: Proponents of rapid deployment assume we can learn from small failures and patch alignment on the fly. Once autonomous systems cross thresholds of recursive self-improvement, cyber-offense, or deceptive situational awareness, the first major alignment failure is also the last. Civilizational survival requires binding international compute governance and verifiable safety proofs before scaling further.`
        ];
      }
      return [
        `Ontological & Moral Diagnosis of the Human Condition: When we examine "${q}" through the enduring tradition of ${person.focus.toLowerCase()}, we see that our technological crisis is, at its root, a crisis of self-knowledge and disordered desire. A tool, no matter how sophisticated, is an amplifier of the consciousness that wields it: if our institutions and inner lives are governed by egoic greed, distraction, and the reduction of living beings into mere instrumentally useful objects, superintelligent machinery will only industrialize our spiritual confusion.`,
        `Recovering Wisdom, Presence & Sacred Stewardship: The true measure of a "Gentle Singularity" cannot be how many flops of compute we amass, but whether our technology deepens human dignity, reverence for life, and compassionate solidarity with the most vulnerable. By anchoring our scientific inventiveness in ${person.focus.toLowerCase()}, we ensure that machines remain humble servants of human flourishing rather than idols that eclipse the human soul.`
      ];
    }

    const state = {
      selectedFour: {
        accelerationist: 'eacc-1',
        pragmatist: 'prag-1',
        pessimist: 'doom-1',
        philosopher: 'phil-1'
      },
      expandedCards: {},

    function getPerson(catId) {
      const cat = CATEGORIES.find((c) => c.id === catId);
      return cat.roster.find((p) => p.id === state.selectedFour[catId]) || cat.roster[0];
    }

    function buildEntry(catId, person, questionText) {
      return {
        person,
        text: synthesizeThinkerResponse(catId, person, questionText),
        expandedParagraphs: synthesizeExpandedReasoning(catId, person, questionText),
        sources: getThinkerSources(person)
      };
    }

    function addComparisonEntry(questionText) {
      const answers = {};
      CATEGORIES.forEach((cat) => {
        const person = getPerson(cat.id);
        answers[cat.id] = buildEntry(cat.id, person, questionText);
      });
      state.comparisons.unshift({ question: questionText, answers });
    }

    addComparisonEntry(SUGGESTED_QUESTIONS[0]);

    window.toggleExpandCard = function(cIdx, catId) {
      const key = `${cIdx}-${catId}`;
      state.expandedCards[key] = !state.expandedCards[key];
      render();
    };

    window.toggleExpandAllInRow = function(cIdx) {
      const allOpen = CATEGORIES.every((cat) => state.expandedCards[`${cIdx}-${cat.id}`]);
      CATEGORIES.forEach((cat) => {
        state.expandedCards[`${cIdx}-${cat.id}`] = !allOpen;
      });
      render();
    };

    window.changeDropdown = function(catId, personId) {
      state.selectedFour[catId] = personId;
      if (state.comparisons.length > 0) {
        const top = state.comparisons[0];
        const person = getPerson(catId);
        top.answers[catId] = buildEntry(catId, person, top.question);
      }
      render();
    };

    window.randomizeFour = function() {
      CATEGORIES.forEach((cat) => {
        const rand = cat.roster[Math.floor(Math.random() * cat.roster.length)];
        state.selectedFour[cat.id] = rand.id;
      });
      if (state.comparisons.length > 0) {
        const top = state.comparisons[0];
        CATEGORIES.forEach((cat) => {
          const person = getPerson(cat.id);
          top.answers[cat.id] = buildEntry(cat.id, person, top.question);
        });
      }
      render();
    };

    window.submitPrompt = function(overrideQ) {
      const inputEl = document.getElementById('chatInput');
      const q = (overrideQ || (inputEl ? inputEl.value : '')).trim();
      if (!q) return;
      if (inputEl) inputEl.value = '';
      addComparisonEntry(q);
      render();

                                    <div class="space-y-2 bg-[#FAF8F5] p-3 rounded-xl border border-stone-200/80">
                                      <div class="text-xs font-bold uppercase tracking-wider text-amber-900">
                                        Deep-Dive Reasoning (${entry.person.name})
                                      </div>
                                      ${entry.expandedParagraphs
                                        .map(
                                          (para) => `
                                        <p class="text-xs leading-relaxed text-slate-700">${para}</p>
                                      `
                                        )
                                        .join('')}
                                    </div>

                                    <!-- Verified Sources & Bibliography -->
                                    <div class="bg-stone-50 p-3 rounded-xl border border-stone-200 space-y-2">
                                      <div class="text-xs font-bold uppercase tracking-wider text-slate-700">
                                        📚 Primary Sources &amp; Bibliography
                                      </div>
                                      <ul class="space-y-2">
                                        ${entry.sources
                                          .map(
                                            (src) => `
                                          <li class="text-xs bg-white p-2.5 rounded-lg border border-stone-200/80 shadow-sm">
                                            <div class="font-semibold text-slate-900">${src.title}</div>
                                            <div class="text-amber-800 font-medium mt-0.5">${src.type} • ${src.year}</div>
                                            <p class="text-slate-600 mt-1 leading-relaxed">${src.detail}</p>
                                          </li>
                                        `
                                          )
                                          .join('')}
                                      </ul>
                                    </div>
                                  </div>
                                `
                                    : ''
                                }
                              </div>
                            </div>
                            <div class="px-4 py-2.5 bg-stone-50 border-t border-stone-200 text-xs text-slate-600">
                              <span class="font-semibold text-slate-800">Core Lens:</span> ${entry.person.focus}
                            </div>
                          </article>
                        `;
                      }).join('')}
                    </div>
                  </div>
                `;
                  })
                  .join('')}
              </div>
            </main>

            <!-- Framed Application Footer -->
            <footer class="bg-white border-t border-stone-200 px-6 py-3 text-xs text-slate-500 flex flex-wrap items-center justify-between gap-2">
              <span>Gentle Singularity Perspectives Panel • 250 Voices Ranked by Prominence Across 4 Pillars</span>
              <span>Click &ldquo;Expand Your Reasoning More&rdquo; on any card for multi-paragraph analysis &amp; verified bibliography</span>
            </footer>
          </div>
        </div>
      `;
    }

    render();
    refreshLiveTenDayTechQuestions();
  </script>
</body>
</html>
